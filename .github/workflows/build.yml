# Controls when the workflow will run
on:
  push:
    branches: [ main, pair_programming ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '2025/go.mod'

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go tests
        run: |
          mkdir -p report
          cd 2025
          gotestsum --junitfile ../report/go-tests.xml --format testname -- -v ./...

      - name: Get Shellspec
        run: curl -fsSL https://git.io/shellspec | tee >(sha256sum) | sh -s -- --yes

      - name: Shellspec jq
        run: shellspec spec/jq_spec.sh --output junit

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit Test Results
          path: report/*.xml

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: report/*.xml
